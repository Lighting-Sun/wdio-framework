name: CI

on:
  push:
    branches: ["main", "continous-integration"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runTest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # .nvmrc is the single source of truth for the Node version, so local
          # and CI cannot drift apart.
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install
        run: npm ci --no-fund --no-audit
      # Static checks run before the suite: they are seconds long, and they
      # catch what a browser run cannot, such as a type error or a floating
      # promise that makes a test pass without asserting anything.
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --env qa
        env:
          # `error` is right locally and useless in CI, where the log is all
          # you get.
          WDIO_LOG_LEVEL: info
      - uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: ./reports/allure/allure-report
