name: CI on demand

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "select environment to run"
        required: true
        default: qa
        type: choice
        options:
          - qa
          - dev
      browser:
        description: "select browser to run"
        required: true
        default: chrome
        type: choice
        options:
          - chrome
          - firefox
      suite:
        description: "select suite to run"
        required: false
        type: choice
        options:
          - regression
          - loginAndPurchase
          - smoke
      artifacts:
        description: "Allure report"
        required: false
        type: boolean

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runTest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install
        run: npm ci --no-fund --no-audit
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # One step that builds its own arguments, rather than one near-identical
      # conditional step per suite. Inputs arrive as environment variables
      # and are quoted at the point of use, so a future switch from `choice` to
      # free text cannot turn an input into shell.
      - name: Test
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          BROWSER: ${{ inputs.browser }}
          SUITE: ${{ inputs.suite }}
          WDIO_LOG_LEVEL: info
        run: |
          args=(--env "$ENVIRONMENT" --browser "$BROWSER")
          if [ "$SUITE" = "smoke" ]; then
            # @smoke tags individual tests across several files, so this stays a
            # grep. Making `smoke` an entry in the `suites` map would select whole
            # files instead and quietly run more than was asked for.
            args+=(--mochaOpts.grep smoke)
          elif [ -n "$SUITE" ]; then
            args+=(--suite "$SUITE")
          fi
          echo "Running: npm test -- ${args[*]}"
          npm test -- "${args[@]}"
      - if: github.event.inputs.artifacts == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: ./reports/allure/allure-report
